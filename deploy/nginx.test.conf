map $http_upgrade $connection_upgrade { default upgrade; '' close; }
upstream club_api {
    # Confirm this against /etc/resolv.conf when creating a different Podman network.
    resolver 10.89.0.1 valid=5s ipv6=off;
    zone club_api 64k;
    server api:8000 resolve;
    keepalive 128;
}
server {
    listen 8080 backlog=2048;
    server_tokens off;
    client_max_body_size 6m;
    # No query string logging: WebSocket URL contains a short-lived ticket.
    access_log off;
    location = /api/v1/ws {
        proxy_pass http://club_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 70s;
        proxy_send_timeout 10s;
    }
    location /api/v1/ {
        proxy_pass http://club_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
    }
    location /health/ { proxy_pass http://club_api; }
    location /metrics { deny all; }
    location / {
        default_type application/json;
        return 426 '{"error":{"code":"UPGRADE_REQUIRED","message":"请重新进入小程序以更新"}}';
    }
}
