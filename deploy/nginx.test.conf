map $http_upgrade $connection_upgrade { default upgrade; '' close; }
map $request_method $club_write_key { default ""; POST "enrollment"; DELETE "enrollment"; }
limit_conn_zone $club_write_key zone=club_writes:1m;
map $request_method $club_login_key { default ""; POST "login"; }
limit_conn_zone $club_login_key zone=club_logins:1m;
upstream club_api {
    # Confirm this against /etc/resolv.conf when creating a different Podman network.
    resolver 10.89.0.1 valid=5s ipv6=off;
    zone club_api 64k;
    server api:8000 resolve;
    keepalive 128;
    # Expire idle upstream sockets before Uvicorn's default 5-second timeout.
    keepalive_timeout 4s;
}
server {
    listen 8080 backlog=2048;
    server_tokens off;
    client_max_body_size 6m;
    # No query string logging: WebSocket URL contains a short-lived ticket.
    access_log off;
    # Global in-flight budget, not an IP limit (campus NAT shares addresses).
    # Keep headroom above the 1500-student acceptance burst.
    location = /api/v1/auth/login {
        limit_conn club_logins 1600;
        limit_conn_status 429;
        error_page 429 = @club_login_busy;
        proxy_pass http://club_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
    }
    location @club_login_busy {
        default_type application/json;
        add_header Retry-After 2 always;
        return 429 '{"error":{"code":"LOGIN_CAPACITY_LIMIT","message":"当前登录人数较多，请稍后重试","request_id":"$request_id"}}';
    }
    location = /api/v1/enrollment {
        limit_conn club_writes 1500;
        limit_conn_status 429;
        error_page 429 = @club_busy;
        proxy_pass http://club_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
    }
    location @club_busy {
        default_type application/json;
        add_header Retry-After 2 always;
        return 429 '{"error":{"code":"CAPACITY_LIMIT","message":"提交较多，请稍后重试；已有结果可正常查询","request_id":"$request_id"}}';
    }
    location = /api/v1/ws {
        proxy_pass http://club_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 70s;
        proxy_send_timeout 10s;
    }
    location /api/v1/ {
        gzip on;
        gzip_types application/json;
        gzip_min_length 512;
        gzip_comp_level 2;
        gzip_vary on;
        proxy_pass http://club_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
    }
    location /health/ { proxy_pass http://club_api; }
    location /metrics { deny all; }
    location / {
        default_type application/json;
        return 426 '{"error":{"code":"UPGRADE_REQUIRED","message":"请重新进入小程序以更新"}}';
    }
}
