server {
    listen 80;
    listen [::]:80;
    server_name wjy-1214.cloud www.wjy-1214.cloud;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://wjy-1214.cloud$request_uri; }
}
server {
    listen 443 ssl http2 backlog=2048;
    listen [::]:443 ssl http2 backlog=2048;
    server_name wjy-1214.cloud www.wjy-1214.cloud;
    ssl_certificate /etc/letsencrypt/live/wjy-1214.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wjy-1214.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/club-access.log club_safe;
    error_log /var/log/nginx/club-error.log warn;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    error_page 503 = @club_maintenance;
    location @club_maintenance {
        default_type application/json;
        add_header Retry-After 300 always;
        return 503 '{"error":{"code":"MAINTENANCE","message":"系统升级维护中，请稍后重试","request_id":"$request_id"}}';
    }
    include /etc/nginx/club-routes.conf;
}
