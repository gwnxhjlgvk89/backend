# Included inside nginx http {}, before the club HTTPS server.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
upstream club_api { server 127.0.0.1:8001; keepalive 128; keepalive_timeout 4s; }
map $request_method $club_write_key { default ""; POST "enrollment"; DELETE "enrollment"; }
limit_conn_zone $club_write_key zone=club_writes:1m;
map $request_method $club_login_key { default ""; POST "login"; }
limit_conn_zone $club_login_key zone=club_logins:1m;
# $uri deliberately excludes query strings and WebSocket tickets.
log_format club_safe escape=json '{"time":"$time_iso8601","request_id":"$request_id","method":"$request_method","uri":"$uri","status":$status,"seconds":$request_time,"upstream_seconds":"$upstream_response_time"}';
