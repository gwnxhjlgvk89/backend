# Merge inside the verified HTTPS server block. Define the map in http {}.
# map $http_upgrade $connection_upgrade { default upgrade; '' close; }
# upstream club_api { server 127.0.0.1:8001; keepalive 128; }
# Set backlog=2048 on the existing listen directive after reviewing its TLS flags.
# All legacy business proxy locations must be removed during cutover.
client_max_body_size 6m;
if (-f /srv/club/shared/maintenance.on) { return 503; }
location = /api/v1/ws {
    access_log off;
    proxy_pass http://club_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 70s;
    proxy_send_timeout 10s;
}
location /api/v1/ {
    proxy_pass http://club_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 15s;
}
location /health/ { proxy_pass http://club_api; }
location /metrics { deny all; }
location / {
    default_type application/json;
    return 426 '{"error":{"code":"UPGRADE_REQUIRED","message":"请关闭并重新进入小程序以更新"}}';
}
