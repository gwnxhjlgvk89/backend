[project]
name = "club-system"
version = "2.0.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "asyncmy>=0.2.10,<0.3",
  "alembic>=1.15,<2",
  "redis>=5,<7",
  "pydantic-settings>=2.8,<3",
  "PyJWT>=2.10,<3",
  "bcrypt>=4.3,<5",
  "python-multipart>=0.0.20",
  "openpyxl>=3.1,<4",
  "prometheus-client>=0.21,<1",
  "httpx>=0.28,<1",
  "cryptography>=44,<50",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11",
    "locust>=2.33,<3",
    "websockets>=14,<17",
    "aiohttp==3.13.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
